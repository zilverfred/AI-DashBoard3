name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Find Project Directory and Build
      run: |
        # پیدا کردن مسیر فایل تنظیمات گرادل در پروژه
        SETTINGS_FILE=$(find . -name "settings.gradle*" -not -path "*/.*" | head -n 1)
        
        if [ -z "$SETTINGS_FILE" ]; then
          echo "Error: settings.gradle or settings.gradle.kts not found!"
          exit 1
        fi
        
        # رفتن به پوشه‌ای که فایل تنظیمات در آن قرار دارد
        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        echo "Project directory found at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # اجرای بیلد مستقیم با گرادل
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
